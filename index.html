<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE | Universal Video Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B0E14;
            --card-bg: #121824;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #E2E8F0;
            --text-muted: #64748B;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 242, 254, 0.1);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            text-align: center;
            letter-spacing: 3px;
            margin: 0;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 40px;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .upload-box {
            border: 2px dashed rgba(0, 242, 254, 0.3);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-box:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        input[type="file"] {
            display: none;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0B0E14;
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--text-main);
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            border: none;
            border-radius: 8px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }

        .status-tag {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-cyan);
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 10px;
        }

        video {
            width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            margin-bottom: 15px;
            display: none;
        }

        .log-box {
            background: #0B0E14;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #A0AEC0;
        }

        .download-btn {
            display: none;
            width: 100%;
            text-align: center;
            padding: 12px 0;
            margin-top: 10px;
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OMNIVERSE</h1>
    <div class="subtitle">Universal AI Video Language Transmutation Engine</div>

    <div class="grid">
        <!-- Left Side Input Controls -->
        <div>
            <div class="section-title">1. SELECT SOURCE VIDEO CAPSULE</div>
            <div class="upload-box" onclick="document.getElementById('videoInput').click()">
                <span id="uploadLabel">🛸 Click to select or drop video file</span>
                <input type="file" id="videoInput" accept="video/*" onchange="updateFileName()">
            </div>

            <div class="section-title" style="margin-top: 25px;">2. CHOOSE TARGET DESTINATION DIALECT</div>
            <select id="languageSelect">
                <option value="Telugu">Telugu (తెలుగు)</option>
                <option value="English">English</option>
            </select>

            <button class="btn" onclick="startTransmutation()">INITIATE TRANSMUTATION</button>
        </div>

        <!-- Right Side Output Displays -->
        <div>
            <div class="section-title">SYSTEM TRANSMUTATION OUTPUT</div>
            <div id="statusTag" class="status-tag">STATUS: IDLE</div>

            <!-- Video Player playing dubbed video -->
            <video id="videoPlayer" controls></video>

            <div class="log-box" id="transcriptionLog">
                [Awaiting input stream...]
            </div>

            <!-- Download Button for Translated Video (.mp4) -->
            <a id="downloadVideoBtn" href="/get-video" download="final_dubbed_video.mp4" class="download-btn">
                🎬 DOWNLOAD DUBBED VIDEO (.MP4)
            </a>

            <!-- Download Button for Translated Audio (.mp3) -->
            <a id="downloadAudioBtn" href="/get-audio" download="translated_audio_female.mp3" class="download-btn">
                🎵 DOWNLOAD DUBBED AUDIO (.MP3)
            </a>
        </div>
    </div>
</div>

<script>
    function updateFileName() {
        const input = document.getElementById('videoInput');
        const label = document.getElementById('uploadLabel');
        if (input.files.length > 0) {
            label.innerText = "🛸 Ready: " + input.files[0].name;
        }
    }

    async function startTransmutation() {
        const fileInput = document.getElementById('videoInput');
        const selectedLang = document.getElementById('languageSelect').value;
        const statusTag = document.getElementById('statusTag');
        const logBox = document.getElementById('transcriptionLog');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadVideoBtn = document.getElementById('downloadVideoBtn');
        const downloadAudioBtn = document.getElementById('downloadAudioBtn');

        if (fileInput.files.length === 0) {
            alert("Please select a video file first!");
            return;
        }

        statusTag.innerText = "STATUS: PROCESSING PIPELINE ACTIVE";
        statusTag.style.color = "#FFB000";
        logBox.innerHTML = "Processing audio extraction, Whisper AI transcription, " + selectedLang + " translation, and female multi-voice TTS...";
        videoPlayer.style.display = "none";
        downloadVideoBtn.style.display = "none";
        downloadAudioBtn.style.display = "none";

        try {
            const response = await fetch('/process-video', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/octet-stream',
                    'Target-Language': selectedLang
                },
                body: fileInput.files[0]
            });

            const data = await response.json();

            if (data.status === "success") {
                pollTranslationResult();
            } else {
                throw new Error(data.message);
            }
        } catch (err) {
            statusTag.innerText = "STATUS: ERROR";
            statusTag.style.color = "#FF4B4B";
            logBox.innerText = "Error processing video: " + err.message;
        }
    }

    async function pollTranslationResult() {
        const statusTag = document.getElementById('statusTag');
        const logBox = document.getElementById('transcriptionLog');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadVideoBtn = document.getElementById('downloadVideoBtn');
        const downloadAudioBtn = document.getElementById('downloadAudioBtn');

        try {
            const res = await fetch('/get-result');
            const data = await res.json();

            if (data.translation) {
                logBox.innerHTML = "[SYSTEM SUCCESS]:<br><br>" + data.translation;
                statusTag.innerText = "STATUS: TRANSMUTATION READY";
                statusTag.style.color = "#00f2fe";

                if (data.has_video) {
                    videoPlayer.src = "/get-video?t=" + new Date().getTime();
                    videoPlayer.style.display = "block";
                    downloadVideoBtn.style.display = "block";
                }

                if (data.has_audio) {
                    downloadAudioBtn.style.display = "block";
                }
            }
        } catch (err) {
            console.error("Polling error:", err);
        }
    }
</script>

</body>
</html>
