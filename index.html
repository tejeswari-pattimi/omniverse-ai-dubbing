<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE | Universal Video Interpreter</title>
    <style>
        :root {
            --bg-glow: radial-gradient(circle at 50% 50%, #141529 0%, #070814 100%);
            --neon-cyan: #00f2fe;
            --neon-purple: #4facfe;
            --glass-panel: rgba(25, 27, 49, 0.4);
            --border-glow: rgba(0, 242, 254, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background: var(--bg-glow);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--glass-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(79, 172, 254, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 800;
        }

        header p { color: #8a8fbc; font-size: 0.95rem; margin-top: 8px; letter-spacing: 1px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .panel-left, .panel-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            font-weight: 600;
        }

        .upload-zone {
            border: 2px dashed rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            background: rgba(7, 8, 20, 0.3);
        }

        .upload-zone:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
            background: rgba(7, 8, 20, 0.5);
        }

        select {
            width: 100%;
            padding: 14px;
            background: rgba(7, 8, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        select option { background: #070814; color: white; }

        .btn-glow {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 14px;
            color: #070814;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 242, 254, 0.6);
        }

        .terminal {
            flex-grow: 1;
            background: rgba(5, 6, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            min-height: 180px;
            max-height: 250px;
            font-family: 'Courier New', Courier, monospace;
            color: #a4b1cd;
            line-height: 1.6;
            overflow-y: auto;
        }

        video {
            width: 100%;
            border-radius: 16px;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            display: none;
            background: #000;
        }

        .status-badge {
            align-self: flex-start;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
            color: #8a8fbc;
        }

        .status-badge.processing { background: rgba(242, 201, 76, 0.15); color: #f2c94c; }
        .status-badge.ready { background: rgba(39, 174, 96, 0.15); color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Omniverse</h1>
        <p>Universal AI Video Language Transmutation Engine</p>
    </header>

    <div class="grid">
        <div class="panel-left">
            <label>1. Select Source Video Capsule</label>
            <div class="upload-zone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                <span id="uploadLabel">🪐 Drag Video Capsule or Click to Scan</span>
                <input type="file" id="fileInput" accept="video/*" style="display: none;" onchange="updateFileName()">
            </div>

            <label>2. Choose Target Destination Dialect</label>
            <select id="targetLanguage">
                <option value="English">English</option>
                <option value="Hindi">Hindi (हिन्दी)</option>
                <option value="Telugu">Telugu (తెలుగు)</option>
                <option value="Tamil">Tamil (தமிழ்)</option>
                <option value="Spanish">Spanish (Español)</option>
                <option value="French">French (Français)</option>
                <option value="Japanese">Japanese (日本語)</option>
                <option value="Korean">Korean (한국어)</option>
            </select>

            <button class="btn-glow" onclick="startTransmutation()">Initiate Transmutation</button>
        </div>

        <div class="panel-right">
            <label>System Transmutation Output</label>
            <div class="status-badge" id="statusBadge">Status: Waiting for input</div>
            
            <video id="outputVideo" controls></video>

            <div class="terminal" id="terminalOutput">// Standby... awaiting multi-dialect input payload matrix.</div>
        </div>
    </div>
</div>

<script>
    function updateFileName() {
        const file = document.getElementById('fileInput').files[0];
        if (file) document.getElementById('uploadLabel').innerText = `🛸 Ready: ${file.name}`;
    }

    async function startTransmutation() {
        const fileInput = document.getElementById('fileInput');
        const language = document.getElementById('targetLanguage').value;
        const terminal = document.getElementById('terminalOutput');
        const badge = document.getElementById('statusBadge');
        const videoPlayer = document.getElementById('outputVideo');

        if (!fileInput.files[0]) {
            alert("Please select a video file capsule first.");
            return;
        }

        // Reset UI state
        videoPlayer.style.display = "none";
        videoPlayer.pause();
        badge.className = "status-badge processing";
        badge.innerText = "Status: Transmuting Stream...";
        terminal.innerText = `[SYSTEM CORE]: Processing ${fileInput.files[0].name}...\n[AI ENGINE]: Running Whisper AI Speech Transcription & Translation...`;

        try {
            const response = await fetch('/process-video', {
                method: 'POST',
                headers: { 'X-Target-Language': language },
                body: fileInput.files[0]
            });
            const data = await response.json();

            if (data.status === "success") {
                // Poll backend for completed translation and dubbed video
                pollTranslationResult();
            } else {
                throw new Error(data.message);
            }
        } catch (err) {
            badge.className = "status-badge";
            badge.innerText = "Status: Core Failure";
            terminal.innerText = `[ERROR]: Process failed. Cause: ${err.message}`;
        }
    }

    let checkInterval;
    function pollTranslationResult() {
        clearInterval(checkInterval);
        const terminal = document.getElementById('terminalOutput');
        const badge = document.getElementById('statusBadge');
        const videoPlayer = document.getElementById('outputVideo');

        checkInterval = setInterval(async () => {
            const res = await fetch('/get-result');
            const data = await res.json();

            if (data.translation) {
                clearInterval(checkInterval);
                badge.className = "status-badge ready";
                badge.innerText = "Status: Transmutation Ready";
                
                terminal.innerHTML = `<span style="color: var(--neon-cyan)">[WHISPER AI SUCCESS]:</span><br><br>${data.translation}`;
                
                if (data.has_video) {
                    videoPlayer.src = `/get-video?t=${new Date().getTime()}`; // cache buster
                    videoPlayer.style.display = "block";
                    videoPlayer.play();
                }
            }
        }, 2000);
    }
</script>
</body>
</html>
